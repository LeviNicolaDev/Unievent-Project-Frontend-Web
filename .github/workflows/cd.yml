name: CD - Unievent
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build Docker image
        run: docker image build -t ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/api-unievent:latest .

      - name: Push Docker Image
        run: docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/api-unievent:latest
